buildscript {
    dependencies {
        classpath files('jasypt-encrypt-plugin-1.3.3.jar')
    }
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id "io.github.ximtech.jasypt-encrypt-plugin" version "1.3.3"
}

apply plugin: com.github.jasypt.encrypt.JasyptPlugin

group = 'com.codinglemonsbackend'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// MongoDB dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Reactive webflux dependency
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Spring security dependency
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// OAuth2 client dependency
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Spring data validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// jasypt dependency
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	// Slugify dependency
	implementation 'com.github.slugify:slugify:3.0.7'

	// Apache commons lang dependency
	implementation 'org.apache.commons:commons-lang3:3.17.0'

    // Apache commons io dependency for file operations
    implementation 'commons-io:commons-io:2.16.1'

	//Dev tools dependency for faster application restart and live reload
	//developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Imgscalr dependency for image processing
	implementation 'org.imgscalr:imgscalr-lib:4.2'

	// JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Lombok dependencies
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//Modelmapper
	implementation 'org.modelmapper:modelmapper:3.1.1'

	//Cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Jackson JSR310 for LocalDateTime serialization
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	//AWS dependencies
	implementation platform('software.amazon.awssdk:bom:2.21.1')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sqs'
	implementation 'software.amazon.awssdk:sso'
    implementation 'software.amazon.awssdk:ssooidc'

	//Monitoring dependencies
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// 8.x is the Logback 1.5 line, which Boot 3.5 pulls in; 7.4 targets Logback 1.4 and fails at startup
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	
	// GeoIP2 dependency for IP geolocation
	implementation 'com.maxmind.geoip2:geoip2:4.2.0'

	// AI dependencies
	implementation platform("org.springframework.ai:spring-ai-bom:1.1.8")
	implementation 'org.springframework.ai:spring-ai-starter-model-deepseek'
  	implementation 'org.springframework.ai:spring-ai-starter-model-mistral-ai'

    // Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
  	testImplementation 'io.projectreactor:reactor-test'
  	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun{
	if (project.hasProperty('args')) {
        args project.args.split(',')
    }
}