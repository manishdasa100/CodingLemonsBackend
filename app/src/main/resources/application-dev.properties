#MongoDB properties
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.username=cl_backend_dev
spring.data.mongodb.password=backendPass
spring.data.mongodb.database=coding_lemon_dev

#AWS Properties
aws.s3.region=us-east-1
aws.s3.bucket=images-dev-codinglemon

#AWS SQS Properties
aws.sqs.region=ap-south-1
aws.sqs.queue.pending-submissions=https://sqs.ap-south-1.amazonaws.com/127145910540/ExecutionRequestQueue.fifo
aws.sqs.queue.like-events=https://sqs.us-east-1.amazonaws.com/YOUR_ACCOUNT_ID/like-events

assets.domain=assets.codinglemon.com

# Monitoring properties
# management.endpoints.web.exposure.include=health,metrics,scheduledtasks,mappings

#File upload properties
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.codec.max-in-memory-size=5MB

spring.devtools.restart.exclude=io/github/ximtech/jasypt/

spring.data.mongodb.auto-index-creation=true

testcase.runcode.count = 2

like.batch.max-size = 100

# Logging properties
logging.level.root=INFO
logging.file.path=D:/MyWorkbench/Projects/AppLogs/CodingLemon
