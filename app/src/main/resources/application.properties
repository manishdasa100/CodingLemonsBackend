spring.application.name=codinglemon-backend
application.version=1.0.0

server.port=3000

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,configprops,scheduledtasks,mappings,httptrace,beans
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.info.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.env.enabled=true
management.endpoint.configprops.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
management.metrics.tags.application=${spring.application.name}
management.metrics.web.server.request.autotime.enabled=true
management.trace.http.enabled=true

spring.http.client.read-timeout=15s

# The Judge0 poller, the results-retry sweep and the daily cron all share this pool; a single
# thread would let a slow Judge0 call hold up the others.
spring.task.scheduling.pool.size=3

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.codec.max-in-memory-size=5MB

spring.devtools.restart.exclude=io/github/ximtech/jasypt/

# spring.data.mongodb.auto-index-creation=true

like.batch.max-size = 100

# Redis Stream queues (replaces AWS SQS as the work-queue transport)
queue.pending-submissions.stream=stream:pending-submissions
queue.execution-results.stream=stream:execution-results
queue.like-events.stream=stream:like-events

# Execution results are consumed through a group with manual ack: an entry stays pending until
# its side effects commit, is retried after retry-after-seconds, and is retired to the DLQ once
# it has been delivered max-deliveries times.
queue.execution-results.group=backend-result-processors
queue.execution-results.dead-letter-stream=stream:execution-results-dlq
queue.execution-results.retry-after-seconds=60
queue.execution-results.retry-interval-ms=60000
queue.execution-results.max-deliveries=5

# Like events are drained in batches rather than written per click: within one batch only a
# user's final state on a problem survives, and each problem's counter moves once by the net
# change. The consumer name is fixed so entries left pending by a failed batch are still
# reachable after a restart.
queue.like-events.group=backend-like-processors
queue.like-events.consumer=backend-like-processor
queue.like-events.interval-ms=10000
queue.like-events.retry-after-seconds=60
queue.like-events.max-deliveries=5
like.status.ttl-seconds=900

# Executor routing
# Traffic goes to the in-house NSJAIL worker and falls back to Judge0. To pin it by hand,
# SET executor:override to NSJAIL_WORKER or JUDGE0_WORKER in Redis (DEL to resume routing).
executor.job.ttl-seconds=3600
executor.dedup.ttl-seconds=300
executor.stuck-timeout-seconds=300

executor.nsjail.require-heartbeat=true
executor.nsjail.max-consecutive-ie=5
executor.nsjail.ie-cooldown-seconds=600

# Judge0 configuration
executor.judge0.base-url=https://judge0-ce.p.rapidapi.com
executor.judge0.api-key=ENC(SKwIgPRhB8TX4w4ihr8yIKx2eOdc5Y57z587+mi3LYsksq7DX6DDsqylqXs26VHLGL+BJRyXDT0R0ALVqg+JZ3tyG4UjrvAkNQS2/0vGrQHOqr6KxdnCrf0of+zhb9ib)
executor.judge0.api-host=judge0-ce.p.rapidapi.com
executor.judge0.batch-size=20
executor.judge0.poll-interval-ms=2000

logging.level.root=INFO
# logging.level.com.codinglemonsbackend=INFO

