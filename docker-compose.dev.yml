# Dev environment: the MongoDB and Redis that application-dev.properties
# connects to. The app itself runs on the host.
#   docker compose -f docker-compose.dev.yml up -d
name: codinglemon-dev

services:
  mongodb:
    # Pinned to 8: mongodb_data was written by 8.0.6 and mongod refuses to
    # start on a dbpath created by a newer release.
    image: mongo:8
    container_name: mongodb_container
    restart: unless-stopped
    environment:
      # Only applied when /data/db is empty. The existing volume already has
      # these users; these are here to reproduce them after a wipe.
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: admin
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      # Creates cl_backend_dev on a fresh volume. Runs only on first init, so
      # it is a no-op against an existing mongodb_data.
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - app_network
    # Single-node replica set: Mongo requires one for multi-document
    # transactions. With auth on, a keyFile is mandatory even with no peers.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        [ -f /data/configdb/keyfile ] || openssl rand -base64 756 > /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    # Initiates the set on first boot; a no-op every run after that.
    # host must be what the *client* reaches - the app runs on the host, not in
    # app_network. Change to mongodb:27017 if the app ever moves in here.
    healthcheck:
      test: >
        mongosh --quiet -u mongoadmin -p admin --authenticationDatabase admin --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      start_period: 30s
      retries: 10

  redis:
    # Same image prod runs.
    image: redis:7-alpine
    container_name: redis_container
    restart: unless-stopped
    # Keep in sync with spring.data.redis.password in application-dev.properties.
    # maxmemory + noeviction mirror prod (deploy/redis.conf, Day 7): a full Redis fails writes
    # instead of evicting queued work, and the memory alert has a ceiling to measure against.
    command: redis-server --requirepass cheeselings --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      # Loopback only: unlike the properties file, this password is committed.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # Local observability harness: the production Alloy config, pointed at the app running on the
  # host. Opt-in, so a plain `up` is unaffected:
  #   docker compose -f docker-compose.dev.yml --profile observability up -d alloy
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy_container
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # A directory: every *.alloy file in it is loaded as one configuration.
      - /etc/alloy
    volumes:
      - ./deploy/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./deploy/alloy-local.alloy:/etc/alloy/local.alloy:ro
      - ./logs:/var/log/app:ro
      # Read-only, but it still lets Alloy read every container's config, environment included.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    extra_hosts:
      # The app runs on the host in dev; this makes the prod config's backend:9090 reach it.
      - "backend:host-gateway"
    environment:
      REDIS_PASSWORD: cheeselings
      GC_PROM_URL: ${GC_PROM_URL:-}
      GC_PROM_USER: ${GC_PROM_USER:-}
      GC_LOKI_URL: ${GC_LOKI_URL:-}
      GC_LOKI_USER: ${GC_LOKI_USER:-}
      GC_TOKEN: ${GC_TOKEN:-}
    ports:
      # Alloy's debug UI, loopback only.
      - "127.0.0.1:12345:12345"
    networks:
      - app_network

volumes:
  mongodb_data:
    # Pinned. Without this compose creates <project>_mongodb_data and you boot
    # an empty DB while the real dev data sits untouched in mongodb_data.
    name: mongodb_data
  redis_data:

networks:
  app_network:
    driver: bridge