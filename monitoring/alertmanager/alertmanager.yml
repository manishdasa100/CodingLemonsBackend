global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@codinglemons.com'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'
  - match:
      severity: info
    receiver: 'info-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'

- name: 'critical-alerts'
  email_configs:
  - to: 'admin@codinglemons.com'
    subject: '[CRITICAL] CodingLemons Alert'
    body: |
      Alert: {{ range .Alerts }}{{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      {{ end }}
  slack_configs:
  - api_url: 'YOUR_SLACK_WEBHOOK_URL_HERE'
    channel: '#alerts'
    title: 'Critical Alert'
    text: 'Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

- name: 'warning-alerts'
  email_configs:
  - to: 'devops@codinglemons.com'
    subject: '[WARNING] CodingLemons Alert'
    body: |
      Alert: {{ range .Alerts }}{{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      {{ end }}

- name: 'info-alerts'
  email_configs:
  - to: 'monitoring@codinglemons.com'
    subject: '[INFO] CodingLemons Alert'
    body: |
      Alert: {{ range .Alerts }}{{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']