groups:
  - name: codinglemons_alerts
    rules:
      # Application Performance Alerts
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(api_response_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is {{ $value }} seconds for endpoint {{ $labels.endpoint }}"

      - alert: HighErrorRate
        expr: rate(api_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for endpoint {{ $labels.endpoint }}"

      - alert: ApplicationDown
        expr: up{job="codinglemons-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CodingLemons application is down"
          description: "The application has been down for more than 1 minute"

      # Resource Usage Alerts
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM memory usage"
          description: "JVM heap memory usage is {{ $value }}%"

      - alert: HighCPUUsage
        expr: container_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "Container CPU usage is {{ $value }}%"

      # Database Performance Alerts
      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(database_read_duration_seconds_bucket[5m])) > 1 or histogram_quantile(0.95, rate(database_write_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "Database query response time is too high: {{ $value }} seconds"

      # S3 Performance Alerts
      - alert: SlowS3Uploads
        expr: histogram_quantile(0.95, rate(s3_upload_duration_seconds_bucket[5m])) > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow S3 uploads"
          description: "S3 upload time is {{ $value }} seconds"

      - alert: HighS3ErrorRate
        expr: rate(s3_upload_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High S3 error rate"
          description: "S3 error rate is {{ $value }} errors per second"

      # RabbitMQ Alerts
      - alert: HighMessageQueueSize
        expr: rabbitmq_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High message queue size"
          description: "RabbitMQ queue size is {{ $value }} messages"

      - alert: SlowMessageProcessing
        expr: histogram_quantile(0.95, rate(rabbitmq_message_processing_duration_seconds_bucket[5m])) > 30
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow message processing"
          description: "Message processing time is {{ $value }} seconds"

      # Business Metrics Alerts
      - alert: LowUserRegistrations
        expr: rate(user_registrations_total[1h]) < 0.001
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Low user registration rate"
          description: "User registration rate is {{ $value }} registrations per second over the last hour"

      - alert: NoCodeExecutions
        expr: rate(code_executions_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No code executions"
          description: "No code executions detected in the last 30 minutes"

      # Infrastructure Alerts
      - alert: HighNetworkUsage
        expr: rate(system_network_input_bytes[5m]) > 100000000 or rate(system_network_output_bytes[5m]) > 100000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network usage"
          description: "Network usage is high: Input {{ $labels.direction }} bytes per second"